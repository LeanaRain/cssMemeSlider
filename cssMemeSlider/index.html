<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEME SLIDER</title>
    <link rel="stylesheet" href="styletest.css">
    <link rel="icon" href="assets/icon-cat.png">     
     
</head>
<body>
    <div class="wrapper">
        <div class="title">MEME SLIDER<span class="dream"> I want to believe</span></div>
        <div class="slider-wrapper">
            <input type="radio" id="slide1" name="slides" class="real-radio" checked>
            <input type="radio" id="slide2" name="slides" class="real-radio">
            <input type="radio" id="slide3" name="slides" class="real-radio">
            <input type="radio" id="slide4" name="slides" class="real-radio">
            <div class="slider-track">
                <div class="slide slide1">
                    <img class="img" src="assets/slide1.jpg" alt="slide1"></img>
                    <div class="slide-bottom">
                        <p class="text">Dream project</p>
                        <div class="controls">
                            <label for="slide1" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide2" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide3" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide4" class="areal-button">
                                <span class="round"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="slide slide2">
                    <img class="img" src="assets/slide2.jpg" alt="slide2"></img>
                    <div class="slide-bottom">
                        <p class="text">I'm an artist, that's how I see it</p>
                        <div class="controls">
                            <label for="slide1" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide2" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide3" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide4" class="areal-button">
                                <span class="round"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="slide slide3">
                    <img class="img" src="assets/slide3.jpg" alt="slide3"></img>
                    <div class="slide-bottom">
                        <p class="text">Dreams come true</p>
                        <div class="controls">
                            <label for="slide1" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide2" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide3" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide4" class="areal-button">
                                <span class="round"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="slide slide4">
                    <img class="img" src="assets/slide4.jpg" alt="slide4"></img>
                    <div class="slide-bottom">
                        <p class="text">New job</p>
                        <div class="controls">
                            <label for="slide1" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide2" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide3" class="areal-button">
                                <span class="round"></span>
                            </label>
                            <label for="slide4" class="areal-button">
                                <span class="round"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <!--<div class="controls">
                <label for="slide1" class="areal-button">
                    <span class="round"></span>
                </label>
                <label for="slide2" class="areal-button">
                    <span class="round"></span>
                </label>
                <label for="slide3" class="areal-button">
                    <span class="round"></span>
                </label>
            </div>-->
        </div>
    </div>
</body>
</html>
