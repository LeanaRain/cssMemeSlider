            <input type="radio" id="slide3" name="slides" class="real-radio">

            <div class="slider-track">
                <div class="slide slide1 active">

                </div>
                <div class="slide slide2">

                </div>
                <div class="slide slide3">
                    <img class="img" src="assets/slide3.jpg" alt="slide3"></img>
                    <span class="text">Dreams come true</span>
                </div>
            </div>
            <div class="controls">
                    <label for="slide1" class="areal-button">Slide 1</label>
                    <label for="slide2" class="areal-button">Slide 2</label>
                    <label for="slide3" class="areal-button">Slide 3</label>
